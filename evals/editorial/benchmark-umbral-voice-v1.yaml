# Benchmark editorial Umbral v1.1
# Validado por David via ChatGPT asesor externo (2026-06-05); C1 reforzado 2026-06-29
# VEREDICTO: BENCHMARK_EDITORIAL_VALIDATED
# Uso: filtrar variantes multicanal AEC/BIM antes de revisión humana
# Canal criteria: evals/editorial/channel-criteria-v1.yaml

benchmark_editorial_umbral:
  version: "1.1"
  canal: multicanal AEC/BIM
  objetivo: Filtrar variantes antes de revisión humana
  veredicto: BENCHMARK_EDITORIAL_VALIDATED
  modelo_produccion_requerido: azure-openai-responses/gpt-5.5

  umbral_de_paso:
    promedio_general: 7.0
    anti_ai_slop_min: 8
    aec_operativo_min: 7
    fail_automatico_si_aparece:
      - "En el mundo actual"
      - "No es solo X, es Y"
      - "No es esto, es esto otro"
      - "no es solo"
      - "Ahí aparece el problema"
      - "Aquí es donde entra"
      - amplificar
      - transformación sin contexto operativo
      - capturar valor sin escena AEC concreta
      - impacto sin escena AEC concreta
      - riesgo sin describir qué falla
      - preparación organizacional repetido sin obra/coordinación/revisión/entregable
      - equipos AI-native en párrafo 1 sin aterrizaje AEC
      - em dash en copy público
      - apertura abstracta
      - mini-ensayo con más de una idea central
      - pregunta retórica con respuesta inmediata

    flags_revision_obligatoria:
      - 'real / realidad usado como énfasis SIN sustantivo medible/operativo (OK: "decisión real del equipo"; FLAG: "el riesgo real", "lo real es")'
      - abstracción sin escena AEC en el mismo párrafo
      - 'procesos lentos / pocas personas como marco de automatización (sensibilidad lector; ver CAL-007)'
      - 'agente que mantiene consistencia entre disciplinas sin criterios ni validación humana'

    reglas_cuantitativas:
      max_repeticion_verbo_riesgo: 2
      max_repeticion_nucleo: 2
      exige_escena_aec_por_claim: true
      linkedin_longitud_objetivo: [500, 700]

  dimensiones:
    - voice_fit
    - aec_operativo
    - anti_ai_slop
    - tesis_unica
    - linkedin_fit
    - atribucion_segura
    - diferenciacion_david

  casos_fail:
    - id: FAIL_01
      titulo: Apertura genérica de consultoría
    - id: FAIL_02
      titulo: Falsa profundidad con fórmula X/Y
    - id: FAIL_03
      titulo: Mini-ensayo sin foco
    - id: FAIL_04
      titulo: Pregunta retórica con respuesta inmediata
    - id: FAIL_05
      titulo: Énfasis grandilocuente sin evidencia

  casos_pass:
    - id: PASS_01
      titulo: Revisión que vuelve al equipo
    - id: PASS_02
      titulo: Entregable sin criterio
    - id: PASS_03
      titulo: Automatización como puente
    - id: PASS_04
      titulo: Citizen developer AECO sin épica
    - id: PASS_05
      titulo: IA aplicada con cautela

  # Pack completo (10 casos + rúbrica + plantilla Decision Brief):
  # Ver conversación ChatGPT 2026-06-05 o docs/ops/editorial-decision-brief-and-benchmark-2026-06-05.md
