thesis: Automatizar sin gobernanza escala el desorden

pattern_synthesis: |
  Los marcos normativos existentes (ISO 19650, BCF, NBIMS-US) ya definen prerrequisitos
  de gobernanza — roles, estados auditables, BEP con criterios de aceptación — pero la
  narrativa de adopción de IA en AEC a menudo opera como si esos marcos no existieran.
  McKinsey documenta que la brecha de productividad en construcción persiste por
  fragmentación de procesos, no solo por falta de herramientas. Automatizar sin esos
  controles previos amplifica el desorden, no lo resuelve.

