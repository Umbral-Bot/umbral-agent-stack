# Criterios editoriales por canal — Umbral/David (v1)
# Complementa benchmark-umbral-voice-v1.yaml y CALIBRATION.md

schema_version: 1

regla_voz_umbral:
  - Usar escenas concretas de AEC/BIM antes que abstracciones.
  - Preferir frases directas y operativas.
  - Evitar tono consultor, grandilocuente o genérico.
  - Evitar fórmulas repetidas (ver benchmark fail_automatico_si_aparece).
  - No usar "real" o "realidad" como intensificador vacío.
  - Evitar guiones largos en copy público.
  - Mantener la tesis en una frase clara.
  - No inventar datos, cifras, normas, benchmarks ni estudios en piezas de opinión sin fuente primaria.
  - 'Cierre preferente para esta línea editorial: "Primero claridad. Después velocidad."'

# Contrato de cierre (2026-09-02). Vale para todo canal que lleve cierre
# canónico y lo aplica `scripts/editorial/validate_editorial_copy.py` como
# error, no como aviso. Origen: el post live
# `bim-carbono-ciclo-de-vida-diseno`, donde la dirección de RICS quedó cruda y
# el eslogan pegado a ella al final de un muro de párrafos.
cierre_y_fuente:
  fuente_como_hipervinculo: true          # [texto](url), nunca la URL cruda
  cierre_canonico_ultimo: true            # el eslogan es la última línea
  separacion_antes_del_cierre: linea_en_blanco_o_hr
  ejemplo: |
    Fuente: [RICS, Whole Life Carbon Assessment](https://www.rics.org/...)

    Primero claridad. Después velocidad.

linkedin:
  gancho: concreto
  longitud_objetivo_chars: [500, 700]
  primer_parrafo: escena o afirmación fuerte, no introducción genérica
  preferir_afirmativa_sobre_pregunta_inicial: true
  respiracion: párrafos breves para feed
  alt1_cand001_apertura: >-
    Un equipo BIM puede sumar un agente que revise modelos antes de definir
    qué cuenta como una revisión válida.

linkedin_empresa:
  gancho: texto sugerido para *compartir* el post de la empresa, no un teaser nuevo
  longitud_objetivo_chars: [250, 500]
  respiracion: párrafos breves para feed
  requiere_link_blog: true
  requiere_cierre_canonico: false
  nota: >-
    No consumido por código (P2.3); copy manual para el operador, distinto de
    `linkedin` (teaser de David). No lleva cierre canónico porque acompaña al
    post de la empresa, no es una pieza propia: por eso es el único bloque que
    desactiva `requiere_cierre_canonico`.

blog:
  estructura: clara sin relleno
  parrafo: una idea nueva por párrafo
  # Formato de lectura (2026-09-02). El cuerpo es markdown: H2, blockquote y hr
  # son bienvenidos, no defectos. Los subtítulos son operativos (la mesa de
  # revisión, la metodología frente al trabajo cotidiano, cómo empezar), nunca
  # jerga de proceso.
  formato_markdown:
    h2_subtitulos: [2, 4]
    blockquote: una sola cita, tomada del propio texto
    hr_permitido: true
    parrafos: cortos, con aire entre bloques
    prohibido_en_subtitulos: [HITL, V1, V2, payload, alternativa, candidato]
  escenas_aec:
    - modelo
    - interferencias
    - clash
    - RFI
    - entregable
    - revisión
    - trazabilidad
    - versión del modelo
    - aprobación humana
  tono: opinión operativa, no paper ni consultoría

x:
  formato: sintético
  componentes:
    - una tesis
    - una condición operativa
    - un cierre
  sin_adornos: true

# Habilitado el 2026-08-13 (PKG-MACRO-P5-L1-T6). Nada de esto es nuevo: la voz
# sale de `regla_voz_umbral` y la forma de `blog`; las cotas ya estaban
# versionadas como NEWSLETTER_MIN_WORDS / MAX_WORDS / SUBJECT_MAX / PREHEADER_MAX
# en scripts/discovery/lib/variants.py y como fila Newsletter en
# docs/editorial-pipeline/stage6-multiplatform-spec.md. No se invento ninguna cifra.
newsletter:
  formato: email-first
  estructura: clara sin relleno
  parrafo: una idea nueva por párrafo
  componentes:
    - subject_line
    - preheader
    - cuerpo
    - CTA final
  longitud_objetivo_palabras: [400, 700]
  subject_line_max_chars: 60
  preheader_max_chars: 90
  escenas_aec:
    - modelo
    - interferencias
    - clash
    - RFI
    - entregable
    - revisión
    - trazabilidad
    - versión del modelo
    - aprobación humana
  tono: opinión operativa, no paper ni consultoría
  nota: >-
    Las cotas de palabras y de subject/preheader las aplica hoy
    `NewsletterVariant` (scripts/discovery/lib/variants.py); el validador de copy
    todavía no las mide, solo declara el contrato del canal.
