# Claim ledger schema — editorial versioning C2
schema_version: 1
proposito: trazar cada afirmación → fuente → confianza → método
campos_por_claim:
  - claim
  - claim_type
  - fuente
  - url
  - confianza
  - metodo
  - evidencia
regla_opinion: >-
  Si claim_type=opinión y fuente=N/A, exigir campo razon explícita.
precondicion_gate1: true
