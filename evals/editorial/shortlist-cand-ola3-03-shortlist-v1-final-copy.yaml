copy_blog: |
  Automatizar un flujo de información sin acordar primero qué información debe existir no elimina el criterio. Lo mueve a otro lugar: a plantillas distintas, revisiones manuales tardías, modelos que parecen completos pero no responden a la decisión que tienen que sostener.

  En una coordinación de proyecto, el problema rara vez aparece como una gran discusión metodológica. Aparece cuando alguien necesita validar si un elemento aplica a cierto control, si debe traer una propiedad específica, si ese dato está definido como requisito y si puede comprobarse contra el modelo. La automatización deja de ser una promesa abstracta y se vuelve una pregunta previa: qué dato se espera, para qué caso, bajo qué condición y cómo se comprueba.

  La lectura editorial desde openBIM es concreta: antes de automatizar, conviene ordenar los criterios de información que sostienen el flujo. El manual de buildingSMART para IDS permite bajar esa idea a un terreno verificable. IDS se presenta allí como un estándar de buildingSMART para especificar y comprobar requisitos simples de información en modelos IFC. Esa definición alcanza para cambiar la conversación: el foco pasa de pedir información en términos generales a describir requisitos que puedan revisarse de manera explícita.

  El manual también muestra una estructura clave. Una especificación IDS separa aplicabilidad y requisitos. Primero define a qué entidades o casos aplica una exigencia. Después declara qué información debe cumplir esa parte del modelo. Esa distinción evita mezclar el alcance del control con el contenido esperado. En la práctica, ayuda a formular preguntas más limpias: sobre qué elementos corre esta regla, qué propiedad o clasificación se espera, qué condición debe cumplirse y cómo se revisa.

  Otro punto relevante del manual es que existen herramientas de creación y de comprobación de IDS de distintos proveedores. Eso no reemplaza el trabajo de criterio, pero muestra que los requisitos pueden salir del documento informal y entrar en una forma que permite comprobación. La responsabilidad sigue estando en definir bien qué se pide, por qué se pide y a qué decisión sirve.

  Por eso, antes de conectar más herramientas, conviene mirar el punto donde se define el criterio. Si cada equipo interpreta los requisitos a su manera, la automatización acelera diferencias que ya estaban instaladas. Si los requisitos se expresan con especificaciones que distinguen aplicabilidad y requisitos, el flujo puede empezar a apoyarse en controles más claros.

  Fuente: https://raw.githubusercontent.com/buildingSMART/IDS/development/Documentation/UserManual/README.md
  Primero claridad. Después velocidad.

copy_linkedin: |
  Antes de automatizar un flujo de información en proyectos, conviene acordar qué información debe existir, para qué decisión y bajo qué validación.

  Mi lectura desde openBIM es simple: el criterio tiene que estar antes que la conexión entre herramientas. El manual de buildingSMART presenta IDS como un estándar para especificar y comprobar requisitos simples de información en modelos IFC. También ordena cada especificación separando aplicabilidad y requisitos, y registra herramientas de creación y comprobación de distintos proveedores.

  Fuente: https://raw.githubusercontent.com/buildingSMART/IDS/development/Documentation/UserManual/README.md
  Primero claridad. Después velocidad.

