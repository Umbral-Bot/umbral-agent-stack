copy_blog: |
  Alguien pide un modelo para revisar una entrega. Llegan tres versiones. Una incluye las propiedades esperadas, otra usa nombres distintos y la tercera deja campos vacíos. Los archivos abren, pero nadie puede responder con rapidez cuál cumple lo solicitado. El flujo estaba preparado para mover información, no para comprobarla.

  Automatizar en esas condiciones no resuelve el problema. Las decisiones terminan repartidas entre plantillas, scripts y revisiones, y cada equipo define por su cuenta qué dato necesita. El proceso corre más rápido, pero los modelos se siguen revisando con reglas distintas.

  Antes de conectar herramientas, el equipo tiene que acordar cuatro cosas: qué información debe existir, sobre qué elementos, bajo qué condición y para qué revisión. No alcanza con pedir que el modelo venga completo. Hay que definir qué significa completo para la decisión que sigue.

  IDS permite dejar esos requisitos por escrito y comprobarlos en el modelo. El manual de buildingSMART lo presenta como un estándar para especificar y comprobar requisitos simples de información en modelos IFC. Su alcance es acotado y útil: expresar requisitos que luego puedan revisarse contra un modelo.

  Para preparar una comprobación con IDS hay que separar dos preguntas que suelen mezclarse. La aplicabilidad determina a qué entidades o casos corresponde una especificación. Los requisitos establecen qué información debe cumplir esa parte del modelo. Primero se define qué elementos se van a revisar. Después, qué se espera encontrar.

  En una revisión, esa separación evita pedidos generales. En lugar de decir que todos los equipos deben completar una propiedad, se puede precisar sobre qué elementos aplica, cuál es la propiedad requerida y qué condición debe cumplir. Así, cada participante revisa los mismos elementos con la misma regla.

  El manual también señala que existen herramientas de creación y de comprobación de IDS de distintos proveedores. La herramienta puede ayudar a redactar o revisar una especificación, pero antes el equipo tiene que acordar qué se pide y por qué ese dato es necesario.

  El orden es simple. Primero se define el criterio. Luego se expresa el requisito. Después se comprueba el modelo. Recién entonces tiene sentido automatizar pasos del flujo con una base más clara.

  En un flujo openBIM, coordinar información exige acuerdos explícitos entre quienes la producen y quienes la revisan. IDS permite trabajar una parte precisa de ese desafío: especificar y comprobar requisitos simples de información en modelos IFC. No resuelve por sí mismo la coordinación, pero obliga a definir mejor qué queremos controlar.

  Fuente: https://raw.githubusercontent.com/buildingSMART/IDS/development/Documentation/UserManual/README.md
  Primero claridad. Después velocidad.

copy_linkedin: |
  Recibir un modelo no significa que esté listo para revisar. Si nadie definió qué información debe contener, sobre qué elementos y bajo qué condición, la automatización mueve la inconsistencia más rápido.

  Mi lectura desde coordinación es directa: el criterio va primero. IDS, estándar de buildingSMART, permite especificar y comprobar requisitos simples de información en modelos IFC. Para hacerlo, separa aplicabilidad y requisitos. Además, existen herramientas de creación y comprobación de distintos proveedores.

  Fuente: https://raw.githubusercontent.com/buildingSMART/IDS/development/Documentation/UserManual/README.md
  Primero claridad. Después velocidad.

copy_x: |
  Automatizar sin acordar qué información debe existir hace que los modelos se revisen más rápido, pero con reglas distintas. IDS permite especificar y comprobar requisitos simples de información en modelos IFC.
  Primero claridad. Después velocidad.

