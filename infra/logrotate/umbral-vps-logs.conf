# Umbral VPS — logrotate policy for shell-written /tmp logs
# Tanda A (sys-diag 2026-07-17). EXAMPLE / NOT INSTALLED by this PR.
#
# Scope: logs written by shell wrappers (supervisor.sh, cron wrappers) that a
# Python RotatingFileHandler does NOT own. The poller's own log
# (/tmp/notion_poller.log) is rotated in-process by notion-poller-daemon.py and
# is intentionally excluded here to avoid two rotators fighting over one file;
# only its boot log (uncaught stdout/stderr) is covered.
#
# ops_log.jsonl is NOT covered here — it is rotated by scripts/ops_log_rotate.py
# (retention in days, UMBRAL_OPS_LOG_RETENTION_DAYS). Schedule that script from
# cron (weekly) as part of the A4-live handoff.
#
# INSTALL (handoff to Copilot VPS — do NOT run from this repo session):
#   sudo cp infra/logrotate/umbral-vps-logs.conf /etc/logrotate.d/umbral-vps-logs
#   sudo logrotate --debug /etc/logrotate.d/umbral-vps-logs   # dry-run first
# Note: /tmp logs are ephemeral (cleared on reboot); this bounds growth between
# reboots. Consider moving these logs under ~/logs for durability in a later
# package.
#
# ROLLBACK: rm /etc/logrotate.d/umbral-vps-logs

/tmp/supervisor.log
/tmp/notion_poller_boot.log
/tmp/notion_poller_cron.log
/tmp/worker.log
/tmp/health_check.log {
    size 10M
    rotate 5
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
    su rick rick
}
