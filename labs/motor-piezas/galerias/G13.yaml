  Paso 2 del Preset 02. La división quedó en la banda abajo (G12 1°, elegida por David).
  Cuatro maneras de repartir el peso entre el titular, la bajada, el kicker y el llamado;
  la imagen, los colores y el pie no cambian. Laboratorio: no publicar.
