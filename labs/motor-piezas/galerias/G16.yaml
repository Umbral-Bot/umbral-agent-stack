titulo: "Galería 16 · Preset 02 (post de noticia), paso 5: pie y detalles"
descripcion: >
  Paso 5 de 5 del Preset 02, el último. Quedan fijas la banda abajo, la jerarquía base, la
  imagen a sangre y la bajada blanca (G15 2°). Cuatro variantes del pie y de los detalles; cada
  una cambia una sola cosa respecto de la 1°. La hoja 01_detalle.jpg muestra la banda de texto
  de las cuatro lado a lado. Laboratorio: no publicar.
