id: G23
fecha: 2026-11-10
titulo: "Galería 23 · LinkedIn sin bajada con el botón más chico"
descripcion: >
  Elección de David en G22: «1 peor el boton mas pequeño» (la 1°, con el botón más chico). Se
  mantiene la 1° de G22, con 32 px entre «Artículo» y el titular y el botón al pie de la columna.
  Aquí solo cambia el tamaño del botón. Laboratorio: no publicar.
resumen: >
  La 1° de G22 con el texto del botón un 12 % más chico (1°), un 24 % más chico (2°) y un 24 %
  más chico con menos relleno (3°).
como_elegir: >
  Elige una del 1° al 3°. La hoja 01_detalle.jpg muestra la columna de texto más grande.
