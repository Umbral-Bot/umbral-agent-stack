id: G24
fecha: 2026-11-10
titulo: "Galería 24 · piloto de Magnific One con el kit de marca"
descripcion: >
  David aprobó el piloto de 430 créditos («y si apruebo el gasto de 430 creditos en maginific»):
  una grilla de borradores (250) y una imagen final a 2k con el kit «Umbral BIM» (180). La imagen
  no trae texto ni logo; el motor la recorta para cada formato y pone el texto, el lockup oficial
  y la verificación UB-3. Los presets 02 y 03 quedan como David los eligió; solo cambia la imagen.
  Laboratorio: no publicar.
resumen: >
  El Preset 02 (4:5, 1:1, 9:16, 16:9 y LinkedIn) y el Preset 03 (1:1 y LinkedIn) con la misma
  imagen maestra de Magnific One.
como_elegir: >
  Dime si la imagen sirve para la marca y si cambiarías algo del pedido. Con eso el motor queda
  listo para pedir la imagen de cada artículo.
contenido: contenido/articulo-magnific-piloto.yaml
