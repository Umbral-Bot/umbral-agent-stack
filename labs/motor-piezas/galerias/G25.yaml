id: G25
fecha: 2026-11-10
titulo: "Galería 25 · el objeto entero y centrado en la máscara de imagen"
descripcion: >
  Comentario de David sobre G24: «algunos de los formatos quedaron bueni , otros no tanto, el
  objeto no quedó bien posicionado respecto del lienzo disponible para la imagen, es decir respecto
  de la mascara usadal». En G24 el motor llenaba la máscara con la imagen y recortaba alrededor
  del turquesa: el edificio quedó cortado arriba en el 1:1 del Preset 02 y en el 16:9, y corrido a la
  derecha en los LinkedIn y el 9:16. El motor 0.3m encuadra por objeto: la caja medida del edificio
  va entera y centrada en cada máscara, al tamaño elegido; donde la imagen no cubre la máscara, su
  propio fondo se extiende con un borde difuso. Es la misma imagen de Magnific (sin créditos nuevos).
  Laboratorio: no publicar.
resumen: >
  Los siete formatos de los presets 02 y 03 con el edificio entero y centrado en su máscara: al 75 %
  en todas (1°), al 85 % en las bandas y al 75 % en las columnas (2°) y al 85 % en todas (3°).
como_elegir: >
  Elige el tamaño del objeto: 1°, 2° o 3° (cada uno se ve en los siete formatos). Las columnas son
  las máscaras más angostas que 1,3:1: los dos LinkedIn y el 9:16.
contenido: contenido/articulo-magnific-piloto.yaml
secciones:
  - alternativa: objeto-75
    titulo: "1° · el objeto al 75 % de la máscara en todos los formatos"
    descripcion: >
      El edificio ocupa el 75 % de la máscara en su dimensión más justa, centrado.
    contenido: contenido/articulo-magnific-piloto.yaml
    sufijo: o75
    valores: {imagen_ajuste: objeto, imagen_objeto_ocupa: 0.75, imagen_objeto_ocupa_columna: null}
    pasos: &formatos
      - "Preset 02 · 4:5"
      - "Preset 02 · 1:1"
      - "Preset 02 · 9:16"
      - "Preset 02 · 16:9"
      - "Preset 02 · LinkedIn"
      - "Preset 03 · 1:1"
      - "Preset 03 · LinkedIn"
    piezas: &packs
