id: G27
fecha: 2026-11-11
titulo: "Galería 27 · dos caminos de imagen: fondo abstracto y fórmula de gráfico relacionado"
descripcion: >
  David sobre G26: «esa versión que hiciste quedó mucho meojr, ahora haz 2 versiones de cada una, una que
  sea como tipo un fondo, no un objeto [...] seria mas bien un adorno grefico, con elementos relacionados
  peroo no neceasriamente relacionado con el sentido del texto y otro camoino para tener una formula donde
  podamos tener graficos relacionados (revisa lo que está en el proyecto de automatizacion editorial del
  repo umbral-agent-stack [...])». Dos variantes por camino, cada una con su imagen principal (16:9) y su
  apaisada (21:9): 8 imágenes de Magnific One con el kit, 1.440 créditos. Laboratorio: no publicar.
resumen: >
  Cuatro campañas de siete formatos: A1 y A2 con fondo abstracto (la imagen llena la máscara), B1 y B2 con
  la fórmula de gráfico relacionado (el choque marcado y dos recorridos abiertos).
como_elegir: >
  Elige camino (A o B) y variante (1 o 2), o dime qué tomar de cada una.
contenido: contenido/articulo-formula-v1.yaml
