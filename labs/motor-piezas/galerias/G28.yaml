id: G28
fecha: 2026-11-11
titulo: "Galería 28 · modelos, posición en la máscara y recorte de fondos"
descripcion: >
  David sobre G27: «respecto del camino A [...] como se deetrmina que parte de la iamgn poner o como
  seposiciona?? respecto del camino B [...] tambien falta unmetodo para posicionar dentro de la mascara
  no?» y «prueba b1 tamiben en nano banana 2.1 para comparar». Camino B: B1 de Magnific One y dos
  variantes de Nano Banana 2.1 (260 créditos), todas con anclaje por acento (motor 0.3p). Camino A:
  A1 y A3 con recorte óptimo. Laboratorio: no publicar.
resumen: >
  Ocho campañas de siete formatos: tres del camino B (Magnific One y Nano Banana 2.1, anclaje por
  acento), dos del camino A con recorte óptimo y tres del camino A con imágenes rescatadas de la
  biblioteca de noviembre.
como_elegir: >
  Dime qué modelo prefieres para el camino B y si el anclaje y el recorte óptimo mejoran.
