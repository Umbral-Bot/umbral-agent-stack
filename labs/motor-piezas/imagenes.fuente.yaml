# Campos editoriales de la capa de imagen. catalogar_imagenes.py les suma los
# metadatos leídos del PNG y escribe imagenes.yaml.
#
# Decisión del Director (2026-11-06): las imágenes Midjourney ya hechas son imágenes
# fijas que entran al hueco de la plantilla, no algo reproducible. Su catálogo
# (00_insumos/catalogo_capa_imagen.*) registra modelo, prompt completo, --sref y
# semilla como «no registrado». El PNG sí trae el prompt con --ar y --v 8.2 y el
# Job ID (campo Description); no trae --sref, perfil ni semilla. Se copia lo que
# dice el archivo como procedencia, sin volverlas reproducibles.
nota_perfil: "pt75u citado en 06_Midjourney/03-variaciones-favoritos-2026-11-06/README.md; no figura en el prompt embebido"
