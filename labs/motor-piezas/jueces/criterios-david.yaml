# Criterios de David para los jueces del motor de piezas. Cada uno con su cita literal (verificada contra
# decisiones.csv, README.md, galerias/, analisis/, la memoria del proyecto y sus mensajes) y la galería
# desde la que vale (`desde`). Cada juez recibe los que tocan su lente (jueces.py preparar).
# Se agregan o corrigen con cada desacuerdo entre los jueces y David (ver README.md de esta carpeta).
# `desde` y `hasta`: la primera y la última galería de su evidencia. Al medir sobre una galería pasada, un
# juez solo recibe los criterios cuya evidencia es toda anterior a ella (hasta < galería). Los de tipo
# «proceso» con lentes [todas] los recibe cada juez.
# `rechazados`: criterios que se probaron sobre galerías pasadas y no mejoraron el acierto. No se le
# pasan a los jueces; quedan para no volver a probarlos igual.
# `estado`: activo (lo dijo David o ya pasó la prueba) o «a prueba» (inferido: se mide en la próxima galería y
# sale si baja el acierto). Lo que David dice con sus palabras entra activo; lo que se infiere, a prueba.
version: 1
criterios:
