    tiene que leerse con holgura: no puede verse lavado ni competir con la textura de la imagen. Si falla, es un
    defecto que se corrige antes de aprobar, aunque la composición sea buena.'
  tipo: rechazo
  lentes:
  - pieza.lectura
  - pieza.jerarquia
  confianza: alta
  desde: G01
  hasta: G02
  evidencia:
