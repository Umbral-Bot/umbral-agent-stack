# Rúbricas de los jueces del motor de piezas · versión 2 (2026-11-11).
# Cada lente es un juez independiente (un agente) que mira las piezas con un solo criterio. El código
# mide antes (UB-3, contraste, objeto en la máscara, turquesa en el recorte) y el juez usa esas medidas.
#
# Pedido de David (2026-11-11): «la diea es que los jhuueces cada vez adopten mas mis creiterios y tu
# busque sla forma d elqeu lo hagan, editando sus configuraciones y/o flujos». Lo que cambió de la v1
# (jueces/historial/rubricas-v1.yaml):
# - Cada juez recibe los criterios de David que tocan su lente (criterios-david.yaml), con su cita.
# - Dos lentes nuevas para galerías de diseño sin imagen generada: composicion y lectura.
# - Una lente que no aplica a la galería lo dice (no_aplica) y no cuenta en la suma.
# - La suma se pondera con pesos.yaml: cada lente pesa según cuánto coincidió con David.
# - Protocolo ciego: los jueces votan antes que David, el voto se sella y David elige sin verlo.
version: 2

escala: "0 a 10 por opción; 7 o más = sirve; 5 a 7 = sirve con ajustes; menos de 5 = no sirve"
gravedad:
  alta: "impide usar la opción tal cual"
  media: "se nota a tamaño de feed; conviene corregir"
  baja: "solo se ve de cerca o es un detalle"

criterios:
  archivo: criterios-david.yaml
  regla: >
    Son los criterios de David, aprendidos de sus elecciones y comentarios anteriores. Mandan sobre tu
    gusto propio, salvo que rompan una regla de marca UB-3. Si una opción cumple tu lente pero choca con
    un criterio de David, puntúala más bajo y dilo en un hallazgo.

etapas:
  imagen:            # antes de meter una imagen en piezas
    lentes:
      marca:
        mira: "plano, trazo fino y parejo, fondo claro, turquesa solo como acento (B: 2 piezas como máximo), sin brillo, sombra, degradado, 3D ni foto"
        veto: ["texto, letras, números o glifos legibles", "logo o algo que lo imite", "turquesa como fondo"]
      oficio:
        mira: "proyección coherente (isometría o la elegida), uniones resueltas, sin artefactos (tapas dobles, líneas sueltas), el trazo de la familia aprobada"
        veto: ["un error que el público BIM nota a tamaño de feed"]
      contenido:      # solo camino B
        mira: "se lee el hallazgo; la imagen cuenta la misma comparación que el texto; no muestra el remedio que el texto niega"
        veto: ["cuenta otra historia (caso CAND-WLCA-01 del repo)"]
      forma:
        mira: "B: objeto entero y de una pieza, compacto en 16:9 y bajo y ancho en 21:9 (2,5:1 o más). A: sin sujeto, densidad pareja, recortable en cualquier parte"
        veto: []
  pieza:             # la pieza terminada, en sus formatos
    lentes:
      posicion:
        mira: "si hay imagen con objeto: objeto entero y centrado (o con el acento en su destino), márgenes parejos, no toca las marcas ni el panel de texto. Sin imagen con objeto: no aplica"
        veto: ["el objeto cortado por la máscara"]
      costuras:
        mira: "si hay imagen extendida o recortada: el fondo extendido sin escalón de color ni rectángulo visible; ningún acento turquesa cortado en el borde; las cruces de registro no chocan con el dibujo. Si no: no aplica"
        veto: ["un parche rectangular visible a tamaño de feed"]
      jerarquia:
        mira: "el orden de lectura: el titular manda, la imagen acompaña y no compite; kicker, bajada, botón y logo en su lugar y legibles"
        veto: []
      composicion:
        mira: "cómo se reparte el lienzo entre texto e imagen: proporciones, división, alineaciones, aire entre bloques y equilibrio de la pieza vista entera"
        veto: []
      lectura:
        mira: "lo que se lee a tamaño de feed en el celular: contraste del texto chico (sobre imagen con textura pide más que el mínimo), tamaño mínimo, separaciones parejas entre textos, tamaño del botón y del llamado"
        veto: ["un texto que no se lee a tamaño de feed"]
  campana:           # las piezas de un artículo vistas juntas
    lentes:
      unidad:
        mira: "la imagen principal y la apaisada parecen de la misma familia (objetos, trazo, densidad, tono del turquesa)"
        veto: []
      serie:
        mira: "sirve para una serie editorial: cada artículo tendría su imagen sin que todas se vean iguales"
        veto: []

salida:            # lo que devuelve cada juez (esquema del agente)
  no_aplica: "true si tu lente no tiene nada que mirar en esta galería; entonces puntajes vacío"
  puntajes: "objeto {opcion: 0-10}, con el número de opción como clave"
  hallazgos: "lista de {opcion, donde, problema, gravedad}"
  mejor: "el número de la opción que elige tu lente"
  veredicto: "sirve | sirve con ajustes | no sirve"
  resumen: "en castellano, corto"

agregacion:
  orden: "promedio de puntajes de las lentes que aplican, ponderado por pesos.yaml (1 si una lente aún no tiene historia)"
  veto: "un hallazgo de gravedad alta que coincide con un veto de la lente deja la opción en «no sirve», sume lo que sume"
  desempate: "manda la lente con más peso; si empatan, contenido en el camino B y marca en el camino A"

protocolo:         # el flujo que permite aprender
  - "1. La galería se muestra a David numerada y sin el voto de los jueces (pagina_eleccion.py)."
  - "2. Los jueces votan antes de que David elija; el voto se sella en jueces/votos/ (jueces.py sellar)."
  - "3. David elige por número, idealmente con una frase de por qué; va a decisiones.csv y a elecciones.yaml."
  - "4. jueces.py calibrar compara el voto sellado con la elección: acierto, posición de la elegida y acuerdo por lente; recalcula pesos.yaml."
  - "5. Si fallaron, se lee su comentario y se agrega o corrige un criterio en criterios-david.yaml (con su cita) o la mirada de una lente aquí. El cambio queda en el historial y se vuelve a medir sobre las galerías pasadas antes de aceptarlo."
