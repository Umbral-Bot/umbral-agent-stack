  imagen_fuente: mj3_V-S2b_0     # imagen fija de Midjourney (no reproducible)
  imagen_encaje: sangrado_lateral
  imagen_registro: lienzo
  # paso 4 · color: sin cambios de rol. Si el texto vuelve a ir sobre la imagen, rigen estas dos
  contraste_sobre_imagen: 10.0
  colores_sobre_imagen: claros
  # paso 5 · pie y detalles
  logo_composicion: "02"
  logo_altura_relativa: 0.05
  trama_visible: true
  trama_alcance: zona_texto
  trama_opacidad_oscuro: 1.0
