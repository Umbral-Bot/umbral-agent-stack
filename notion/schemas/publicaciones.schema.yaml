# Publicaciones — Notion Database Schema Spec
#
# Defines the structure of the single editorial DB for Rick v1.
# This spec is LOCAL ONLY.  It does NOT create the DB in Notion.
# It serves as the source of truth for validation, tooling, and
# future provisioning scripts.
#
# Decision context:
#   - Single DB (David's decision, no separate Assets DB in v1)
#   - Ghost as blog v1
#   - LinkedIn/X with HITL
#   - content_hash for idempotency
#   - Two human gates: aprobado_contenido, autorizar_publicacion
#   - Assets inline (visual briefs inside Publicaciones)
#   - Referentes as discovery signal, not primary source
#   - [2026-07-22] P1 norte (David + Notion AI, live): added origen_alternativa
#     (relation -> Alternativas / Shortlist) + listo_rrss (checkbox, Fila I = B).
#     See docs/ops/editorial-norte-hitl-contract-2026-07-22.md §6 and
#     notion/schemas/alternativas-shortlist.schema.yaml. Neither field's writer
#     is cabled yet (P2.1 promotion poller, P2.7 RRSS injection).
#   - [2026-08-13] 0.2.0 -> 0.3.0. Added option `retention` to Etapa audiencia.
#     The option already existed in the live Notion DB (drift on record since
#     the 2026-05-08 audit); the spec was the side that lagged, so the auditor
#     reported it as extra_options — severity=info, which keeps the verdict at
#     PASS and made it invisible in CI. David's GO = A: align the YAML to live,
#     do NOT remove the option from Notion. Nothing was written to Notion.
#     Live evidence: data source dc833f1f-07d9-49d0-82ec-fdfad1c808c4, read-only
#     MCP fetch, `Etapa audiencia` = awareness / consideration / trust /
#     conversion / retention (color purple). Surfaced by the review of #636
#     (PKG-MACRO-P5-L1-T2); closed by PKG-MACRO-P5-L1-T3.
#   - [2026-08-28] 0.3.0 -> 0.4.0. Aligned the six already-live governed
#     editorial Drive/Magnific locator URL properties. Nothing was written live.
#
# KNOWN DRIFT (2026-07-22, not resolved here): David's live evidence for this
# PR names the live parent page "Sistema Editorial Rick"
# (https://app.notion.com/p/5894ba351e2749729077ca971fd9f52a), which does not
# match `parent_policy.recommended_parent` below ("Sistema Editorial
# Automatizado Umbral"). Left as-is — unclear if this is a rename of the same
# page or two different pages; confirm with David before changing
# recommended_parent.

database:
  name: Publicaciones
  version: 0.4.0
  status: draft
  owner: Rick / Umbral BIM

  parent_policy:
    recommended_parent: Sistema Editorial Automatizado Umbral
    forbidden_parents:
      - Control Room
      - Bandeja de revisión - Rick
      - Sistema Maestro Apoyo Editorial
      - Asesorías & Proyectos

  description: >
    Base de datos única del sistema editorial Rick v1.  Contiene
    publicaciones, variantes por canal, briefs visuales inline, y
    el estado completo del pipeline editorial.  No separa assets
    en DB aparte (decisión v1).

# ---------------------------------------------------------------------------
# Properties
# ---------------------------------------------------------------------------

properties:

  # -- Identity --

  - name: Título
    type: title
    required: true
    description: Título de la publicación o variante.
    max_length: 300

  - name: publication_id
    type: rich_text
    required: true
    description: >
      Identificador estable generado por el sistema (UUID o slug).
      No es el ID de Notion.  Usado para correlación con OpsLogger,
      publish tracking, y deduplicación.
    max_length: 200

  # -- Classification --

  - name: Canal
    type: select
    required: true
    description: Canal destino de esta variante.
    options:
      - name: blog
        color: blue
        description: Ghost blog post
      - name: linkedin
        color: green
        description: LinkedIn post
      - name: x
        color: gray
        description: X (Twitter) post
      - name: newsletter
        color: purple
        description: Newsletter edition
    validation:
      allowed_values: [blog, linkedin, x, newsletter]

  - name: Tipo de contenido
    type: select
    required: true
    description: Tipo de input editorial (opciones v1 alineadas con DB Notion real).
    options:
      - name: blog_post
        description: Artículo de blog (Ghost)
      - name: linkedin_post
        description: Post de LinkedIn
      - name: x_post
        description: Post de X (Twitter)
      - name: newsletter
        description: Edición de newsletter
      - name: carousel
        description: Carrusel visual multi-slide
      - name: visual_asset
        description: Asset visual standalone
      - name: thread
        description: Hilo multi-post (X o LinkedIn)

  - name: Etapa audiencia
    type: select
    required: false
    description: Etapa del funnel para esta pieza.
    options:
      - name: awareness
      - name: consideration
      - name: trust
      - name: conversion
      - name: retention

  # -- State machine --

  - name: Estado
    type: status
    required: true
    description: >
      Estado principal del pipeline editorial.  La máquina de estados
      avanza linealmente con excepciones documentadas.
    groups:
      - name: No iniciado
        statuses:
          - name: Idea
            color: default
            description: Capturada pero sin desarrollo.
      - name: En progreso
        statuses:
          - name: Borrador
            color: blue
            description: Rick está generando/editando contenido.
          - name: Revisión pendiente
            color: yellow
            description: Esperando aprobación de David.
          - name: Aprobado
            color: green
            description: Gate aprobado_contenido pasado.
          - name: Autorizado
            color: green
            description: Gate autorizar_publicacion pasado.
          - name: Publicando
            color: orange
            description: En proceso de publicación a plataforma.
      - name: Completado
        statuses:
          - name: Publicado
            color: green
            description: Confirmado en plataforma destino.
          - name: Descartado
            color: red
            description: Rechazado o abandonado.

  # -- Human gates --

  - name: aprobado_contenido
    type: checkbox
    required: true
    description: >
      Gate humano 1.  David aprueba el contenido para el canal.
      Si David comenta después de aprobar, este gate se invalida
      y debe re-aprobarse antes de publicar.
    default: false

  - name: autorizar_publicacion
    type: checkbox
    required: true
    description: >
      Gate humano 2.  David autoriza la publicación efectiva.
      Separado de aprobado_contenido porque una pieza puede estar
      aprobada pero no lista para publicar (timing, dependencias).
      LinkedIn/X requieren este gate en fases iniciales (HITL).
    default: false

  - name: gate_invalidado
    type: checkbox
    required: false
    description: >
      Se activa automáticamente si David deja comentario después de
      aprobado_contenido=true.  Bloquea publicación hasta que ambos
      gates se re-evalúen.
    default: false

  # -- Content integrity --

  - name: content_hash
    type: rich_text
    required: false
    description: >
      SHA-256 truncado (16 hex chars) del contenido principal.
      Determinista: mismo contenido → mismo hash.  Usado para
      idempotencia en publish tracking (si el hash no cambió desde
      el último publish_success, no re-publicar).
    max_length: 64

  - name: idempotency_key
    type: rich_text
    required: false
    description: >
      Clave derivada de canal + content_hash + page_id.  Usada por
      publish tracking para deduplicación.
    max_length: 64

  # -- Source tracking --

  - name: Fuente primaria
    type: url
    required: false
    description: >
      URL de la fuente primaria (paper, doc oficial, datos de fabricante).
      No es el post del referente.

  - name: Fuente referente
    type: url
    required: false
    description: >
      URL del referente que sirvió como discovery signal.
      Se cita como señal de descubrimiento, no como fuente de verdad.

  - name: Fuentes confiables
    type: relation
    required: false
    description: >
      Relación a DB de fuentes confiables/autoridad.  Para v1,
      esta relación puede ser manual o semi-automática.
    relation_database: Fuentes confiables

  # -- Publishing metadata --

  - name: platform_post_id
    type: rich_text
    required: false
    description: >
      ID del post en la plataforma destino (Ghost post ID, LinkedIn
      share URN, X tweet ID).  Se llena solo después de publish_success.
    max_length: 200

  - name: publication_url
    type: url
    required: false
    description: >
      URL pública del post publicado.  Se llena después de
      publish_success confirmado.

  - name: Fecha publicación
    type: date
    required: false
    description: Fecha/hora de publicación efectiva.

  # -- RRSS post-publish (Fila I = B, sin autopublish) --
  # Ver docs/ops/editorial-norte-hitl-contract-2026-07-22.md §5.I y
  # docs/ops/editorial-publicaciones-human-review-contract.md §Postcondiciones.

  - name: listo_rrss
    type: checkbox
    required: false
    description: >
      Estado terminal RRSS bajo Fila I = B.  Se marca true tras publish_success
      del blog, una vez inyectados published_url y el copy de Notion en las
      copies por canal.  El post a LinkedIn/X lo hace un humano
      (manual/semi-auto); el código nunca autopublica RRSS.  Añadido en Notion
      2026-07-22 (P1, David + Notion AI).  Cableado del writer (post-publish)
      es P2.7 — no cableado aún.
    default: false

  # -- Visual assets (inline, no separate DB in v1) --

  - name: Visual brief
    type: rich_text
    required: false
    description: >
      Brief del asset visual.  Briefs legacy/v1 conservan scene + avoid.
      Visual brief v2 usa el contrato compacto y versionado de
      docs/ops/editorial-visual-brief-v2-2026-08-29.md: campos semanticos
      comunes + cinco ejes, expandidos por el Worker a cinco prompts.
      Magnific siempre por REST, nunca UI automation. HITL obligatorio si
      hay personas o marcas.
    max_length: 2000

  - name: Visual asset URL
    type: url
    required: false
    description: >
      URL durable de la alternativa seleccionada para la fase visual siguiente.
      Se copia desde imagen_alt_N_url y apunta al archivo persistido en Google
      Drive, nunca al CDN temporal ni al locator de creación de Magnific. El
      overlay T18 final queda fuera de este contrato.

  - name: visual_hitl_required
    type: checkbox
    required: false
    description: >
      True si el visual incluye personas, marcas, o contenido que
      requiere revisión humana antes de usar.
    default: false

  # -- Visual v2: selección de imagen Magnific (docs/ops/notion-publicaciones-v2-visual-gates-schema.md) --
  # Live en Notion desde 2026-06-06 (David + Notion AI, Fase A). Documentado
  # aquí por primera vez en P2.2 (2026-07-23), que cablea el writer de
  # imagen_alt_*_url / imagen_cantidad / imagen_generada_at / imagen_error /
  # Estado imagen=Generando|Listo para selección|Error. `Selección imagen`
  # sigue siendo exclusivamente David (worker/tasks/magnific.py nunca la
  # toca); `Visual asset URL` la copia
  # scripts/editorial/sync_visual_asset_from_selection.py al elegir.
  # Desde HITL Drive (2026-08-28), imagen_alt_*_url contiene enlaces durables
  # de Drive. HITL Drive y los cinco imagen_alt_*_magnific_url ya existen live;
  # este schema los documenta sin crear ni borrar propiedades en Notion.

  - name: Selección imagen
    type: select
    required: false
    description: >
      Gate humano entre texto e imagen final. Sólo David la escribe.
    options:
      - name: Pendiente
        color: gray
        description: Sin elección; o imágenes aún no listas (default)
      - name: Alt 1
        color: blue
      - name: Alt 2
        color: blue
      - name: Alt 3
        color: blue
      - name: Alt 4
        color: purple
        description: Reserva (imagen_cantidad >= 4)
      - name: Alt 5
        color: purple
        description: Reserva (imagen_cantidad >= 5)
      - name: Regenerar
        color: orange
        description: Pedir nuevas variantes
      - name: Sin imagen
        color: yellow
        description: Publicar sin hero (excepción explícita)

  - name: Estado imagen
    type: select
    required: false
    description: >
      Estado de máquina para Rick/Worker. Escrito por
      worker/tasks/magnific.py (P2.2, Generando/Listo para selección/Error)
      y por scripts/editorial/sync_visual_asset_from_selection.py
      (Seleccionada).
    options:
      - name: No aplica
        description: Gate 1 no pasado; sin brief visual (default)
      - name: Pendiente generación
        description: Esperando Magnific
      - name: Generando
        description: images_generate en curso (P2.2 interim state)
      - name: Listo para selección
        description: Cinco URLs durables de Drive en columnas; David puede elegir
      - name: Seleccionada
        description: Visual asset URL ya copiada
      - name: Regeneración pedida
        description: David eligió Regenerar
      - name: Error
        description: Ver imagen_error

  - name: imagen_cantidad
    type: number
    required: false
    description: >
      Cuántas alternativas están activas (N real, hasta 5). Escrito por
      worker/tasks/magnific.py.

  - name: HITL Drive
    type: url
    required: false
    description: >
      webViewLink durable de la subcarpeta Drive de esta generación. Escrito
      por worker/tasks/magnific.py antes de Estado imagen=Listo para selección.

  - name: imagen_alt_1_url
    type: url
    required: false
    description: >
      webViewLink durable del archivo Drive alt-1.png. Escrito por
      worker/tasks/magnific.py; nunca contiene el CDN temporal de Magnific.

  - name: imagen_alt_1_magnific_url
    type: url
    required: false
    description: >
      Locator oficial de la creación Magnific para la alternativa 1, sólo si
      el API lo entrega. Queda vacío si no existe; nunca se construye por inferencia.

  - name: imagen_alt_2_url
    type: url
    required: false
    description: >
      webViewLink durable del archivo Drive alt-2.png. Escrito por
      worker/tasks/magnific.py.

  - name: imagen_alt_2_magnific_url
    type: url
    required: false
    description: >
      Locator oficial de la creación Magnific para la alternativa 2, sólo si
      el API lo entrega. Queda vacío si no existe; nunca se construye por inferencia.

  - name: imagen_alt_3_url
    type: url
    required: false
    description: >
      webViewLink durable del archivo Drive alt-3.png. Escrito por
      worker/tasks/magnific.py.

  - name: imagen_alt_3_magnific_url
    type: url
    required: false
    description: >
      Locator oficial de la creación Magnific para la alternativa 3, sólo si
      el API lo entrega. Queda vacío si no existe; nunca se construye por inferencia.

  - name: imagen_alt_4_url
    type: url
    required: false
    description: >
      webViewLink durable del archivo Drive alt-4.png (reserva). Escrito por
      worker/tasks/magnific.py.

  - name: imagen_alt_4_magnific_url
    type: url
    required: false
    description: >
      Locator oficial de la creación Magnific para la alternativa 4, sólo si
      el API lo entrega. Queda vacío si no existe; nunca se construye por inferencia.

  - name: imagen_alt_5_url
    type: url
    required: false
    description: >
      webViewLink durable del archivo Drive alt-5.png (reserva). Escrito por
      worker/tasks/magnific.py.

  - name: imagen_alt_5_magnific_url
    type: url
    required: false
    description: >
      Locator oficial de la creación Magnific para la alternativa 5, sólo si
      el API lo entrega. Queda vacío si no existe; nunca se construye por inferencia.

  - name: imagen_generada_at
    type: date
    required: false
    description: >
      Timestamp de la última generación persistida 5/5 en Drive. Escrito por
      worker/tasks/magnific.py.

  - name: imagen_error
    type: rich_text
    required: false
    description: >
      Último error Magnific o Drive, si Estado imagen = Error. Escrito por
      worker/tasks/magnific.py.
    max_length: 2000

  # -- Relations --

  - name: Publicación padre
    type: relation
    required: false
    description: >
      Self-relation para variantes/copies.  El blog post original
      es padre; LinkedIn/X/newsletter son variantes hijas.
    relation_database: Publicaciones

  - name: origen_alternativa
    type: relation
    required: false
    description: >
      Back-link a la fila de origen en `Alternativas / Shortlist` (schema:
      alternativas-shortlist.schema.yaml).  Se llena cuando la fila fue
      promovida por el HITL-1 `Aprobar` (contrato §4, §6).  Vacío para filas
      creadas antes de la BD Shortlist o fuera del flujo de promoción.
      Añadido en Notion 2026-07-22 (P1, David + Notion AI).  El writer de
      promoción (P2.1, worker/tasks/editorial_promote.py) está cableado desde
      2026-07-22 — ver docs/ops/editorial-promote-p21-poller-2026-07-22.md.
    relation_database: Alternativas / Shortlist

  - name: Proyecto
    type: rich_text
    required: false
    description: >
      Nombre o referencia del proyecto padre.  v1 fallback: kept as
      text until the canonical projects database is decided.  A future
      version may convert this to a relation once the target DB is
      identified.
    max_length: 200

  # -- Audit --

  - name: Creado por
    type: created_by
    required: false

  - name: Última edición
    type: last_edited_time
    required: false

  - name: trace_id
    type: rich_text
    required: false
    description: >
      ID de traza para correlacionar con OpsLogger events.
    max_length: 200

  - name: Premisa
    type: rich_text
    required: false
    description: >
      Premisa editorial de la pieza: afirmación breve, fuerte y clara
      que condensa la tesis del contenido. No es el título ni el claim
      completo — es la idea central en una o dos frases operativas.
    max_length: 500

  - name: Notas
    type: rich_text
    required: false
    description: Notas internas para el pipeline.
    max_length: 2000

# ---------------------------------------------------------------------------
# State machine transitions
# ---------------------------------------------------------------------------

state_machine:
  initial: Idea
  transitions:
    - from: Idea
      to: Borrador
      trigger: Rick comienza a generar contenido.

    - from: Borrador
      to: Revisión pendiente
      trigger: Rick marca contenido como listo para revisión.

    - from: Revisión pendiente
      to: Aprobado
      trigger: David aprueba contenido (aprobado_contenido = true).
      gate: aprobado_contenido

    - from: Revisión pendiente
      to: Borrador
      trigger: David rechaza o pide cambios.

    - from: Aprobado
      to: Autorizado
      trigger: David autoriza publicación (autorizar_publicacion = true).
      gate: autorizar_publicacion

    - from: Aprobado
      to: Revisión pendiente
      trigger: >
        David comenta después de aprobar → gate_invalidado = true,
        aprobado_contenido = false.  Requiere re-revisión.

    - from: Autorizado
      to: Publicando
      trigger: Sistema inicia publicación a plataforma.

    - from: Autorizado
      to: Revisión pendiente
      trigger: >
        David comenta después de autorizar → gate_invalidado = true,
        ambos gates se resetean.

    - from: Publicando
      to: Publicado
      trigger: >
        Plataforma confirma publicación (publish_success).
        Se llenan platform_post_id y publication_url.

    - from: Publicando
      to: Autorizado
      trigger: >
        Publicación falla (publish_failed).  No avanza a Publicado
        sin confirmación de plataforma.

    - from: ["Idea", "Borrador", "Revisión pendiente"]
      to: Descartado
      trigger: David o Rick descartan la pieza.

# ---------------------------------------------------------------------------
# Invariants
# ---------------------------------------------------------------------------

invariants:
  - name: no_publish_without_gates
    description: >
      Estado no puede ser Publicando o Publicado si
      aprobado_contenido = false o autorizar_publicacion = false.
    check: >
      if estado in (Publicando, Publicado):
        assert aprobado_contenido == true
        assert autorizar_publicacion == true

  - name: gate_invalidation_on_comment
    description: >
      Si David comenta después de aprobado_contenido = true,
      gate_invalidado = true y aprobado_contenido = false.
      Publicación bloqueada hasta re-aprobación.

  - name: no_publish_success_without_platform
    description: >
      Estado Publicado requiere platform_post_id no vacío.
      No se marca Publicado sin confirmación real de la plataforma.

  - name: content_hash_required_for_publish
    description: >
      Antes de publish_attempt, content_hash debe estar calculado.
      idempotency_key se deriva automáticamente.

  - name: linkedin_x_require_hitl
    description: >
      Canal linkedin o x requieren autorizar_publicacion = true
      (HITL) en fases iniciales.  Ghost/blog puede eventualmente
      automatizarse tras aprobado_contenido.

  - name: no_separate_assets_db_v1
    description: >
      Metadatos y gates visuales se gestionan inline en Publicaciones (campos
      Visual brief, Visual asset URL, visual_hitl_required, HITL Drive e
      imagen_alt_*_url); los PNG viven en Drive gobernado. Una DB Notion
      separada de assets es decisión diferida a v1.1/v2.

  - name: referente_is_discovery_not_source
    description: >
      Fuente referente es señal de descubrimiento.  Fuente primaria
      es la fuente de verdad.  Nunca citar al referente como fuente
      primaria.

# ---------------------------------------------------------------------------
# Indexes / views (recommended, not enforced)
# ---------------------------------------------------------------------------

recommended_views:
  - name: Pipeline editorial
    type: board
    group_by: Estado
    filter: null
    sort: Última edición desc
    description: Vista Kanban del pipeline completo.

  - name: Por canal
    type: table
    group_by: Canal
    filter: "Estado != Descartado"
    sort: Fecha publicación desc

  - name: Pendientes de aprobación
    type: table
    filter: "Estado == Revisión pendiente"
    sort: Última edición desc

  - name: Gates invalidados
    type: table
    filter: "gate_invalidado == true"
    sort: Última edición desc
    description: Piezas donde David comentó post-aprobación.

  - name: Publicados
    type: table
    filter: "Estado == Publicado"
    sort: Fecha publicación desc
