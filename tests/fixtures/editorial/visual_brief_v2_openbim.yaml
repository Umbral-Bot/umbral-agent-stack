version: 2
central_fact: Automatizar una comprobación antes de acordar qué información se exige, sobre qué elementos y bajo qué condición no crea un criterio común.
ignored_consequence: El proceso hace que el objeto parezca cada vez más terminado mientras conserva y oculta la fragilidad de origen.
core_metaphor: El mismo objeto técnico en dos estados enfrentados en primer plano; el original crudo y desgastado junto a su versión cosmética impecable, que conserva el mismo defecto de origen aún más visible bajo el acabado nuevo.
invariants:
  - los mismos dos estados del mismo objeto llenan el encuadre en las cinco alternativas
  - la apariencia mejora mientras la validez no mejora
  - el defecto de origen queda visible en ambos estados y más evidente en el pulido
variation_axes:
  - axis: aire y fondo
    direction: dar apenas más aire oscuro alrededor de los dos estados sin abrir el plano
  - axis: profundidad del defecto
    direction: oscurecer el interior del defecto del estado pulido hasta leerse como vacío profundo
  - axis: propagación del defecto
    direction: extender las marcas del defecto del estado pulido más lejos sobre el acabado nuevo
  - axis: ironía de producto
    direction: exagerar el acabado de vitrina y el brillo del estado pulido mientras el defecto gana protagonismo
  - axis: encuadre
    direction: cerrar todavía más el encuadre hasta que los dos estados ocupen casi todo el cuadro
negative_prohibitions:
  - no mostrar un criterio compartido que resuelva la escena
  - no mostrar una validación correcta ni un resultado salvador
  - no introducir un lado de solución o antes y después reparado
  - no agregar estados intermedios ni convertir el contraste en progresión
avoid:
  - texto incrustado
  - marcas o interfaces reconocibles
  - cortes técnicos o secciones de diagrama
engine: pro
aspect_ratio: "4:3"
resolution: 2K
