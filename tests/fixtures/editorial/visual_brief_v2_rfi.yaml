version: 2
central_fact: Acelerar el envío de RFIs sin acordar responsable, contexto mínimo y condición de cierre sólo mueve preguntas, no las resuelve.
ignored_consequence: Una consulta ambigua gana apariencia de trámite terminado mientras sigue sin destinatario y su pendiente crece.
core_metaphor: La misma ficha ámbar en dos estados enfrentados en primer plano; la original arrugada y sin destino junto a su copia replastificada impecable, que sigue sin destinatario y exhibe aún más sellos de pendiente bajo el plástico nuevo.
invariants:
  - los mismos dos estados de la misma ficha llenan el encuadre en las cinco alternativas
  - ningún estado tiene destinatario asignado
  - la marca de pendiente queda visible en ambos estados y más evidente en el replastificado
variation_axes:
  - axis: aire y fondo
    direction: dar apenas más aire neutro alrededor de las dos fichas sin abrir el plano
  - axis: profundidad del pendiente
    direction: oscurecer el casillero de destinatario vacío de la copia hasta leerse como ausencia profunda
  - axis: propagación del pendiente
    direction: multiplicar los sellos de pendiente sobre el plástico nuevo de la copia
  - axis: ironía de trámite
    direction: exagerar el acabado impecable y el brillo del plástico de la copia mientras el pendiente gana protagonismo
  - axis: encuadre
    direction: cerrar todavía más el encuadre hasta que las dos fichas ocupen casi todo el cuadro
negative_prohibitions:
  - no mostrar una respuesta que llega
  - no mostrar una persona o insignia que asume responsabilidad
  - no mostrar check verde, cierre exitoso ni destino resuelto
  - no agregar estados intermedios ni convertir el contraste en progresión
avoid:
  - texto legible incrustado
  - dashboards, interfaces de software o diagramas de flujo
  - escenas de stock corporativo
aspect_ratio: "4:3"
resolution: 2K
