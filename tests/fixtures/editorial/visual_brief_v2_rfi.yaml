version: 2
central_fact: Acelerar el envío de RFIs sin acordar responsable, contexto mínimo y condición de cierre sólo mueve preguntas, no las resuelve.
ignored_consequence: Una consulta ambigua se replica entre equipos, gana apariencia de proceso y vuelve más tarde como una cola mayor de decisiones pendientes.
core_metaphor: Una misma ficha ámbar sin destino entra en una red neumática muy ordenada; cada desvío la duplica y la devuelve a una cola más larga sin alcanzar un receptor.
invariants:
  - la misma ficha ámbar es el origen de todas las copias
  - ningún ramal termina en un receptor
  - cada vuelta aumenta la cola pendiente
variation_axes:
  - axis: longitud de cola
    direction: mostrar una ficha al entrar y cinco copias pendientes acumuladas al salir
  - axis: cámara
    direction: usar una vista cenital amplia que revele el recorrido completo de la ficha
  - axis: geometría del recorrido
    direction: convertir el circuito en una espiral ascendente que parece progreso pero regresa al inicio
  - axis: punto débil
    direction: concentrar la falla en un relevo abierto entre dos tramos donde la ficha queda suspendida
  - axis: método de revelado
    direction: usar una bandeja transparente que exhiba el volumen de fichas idénticas sin destino
negative_prohibitions:
  - no mostrar una respuesta que llega
  - no mostrar una persona o insignia que asume responsabilidad
  - no mostrar check verde, cierre exitoso ni destino resuelto
avoid:
  - texto legible incrustado
  - dashboards, interfaces de software o diagramas de flujo
  - escenas de stock corporativo
aspect_ratio: "4:3"
resolution: 2K
